# build_tools' CI: the package built and tested on Linux and on a Mac, for every pull request and main.
name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    container: swift:6.4.2-noble
    steps:
      - uses: actions/checkout@v5
      - run: swift build --build-tests
      - run: swift test --skip-build
  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - run: swift build --build-tests
      - run: swift test --skip-build
