# build_tools' release proposal (Logan, 2026-11-19: every release has a proof, "even if it's just tests"): the tests
# on Linux and on a Mac, their results made the release's proof (tests-proof) and compared with the release before's
# (proof-diff), then a draft release of the version with them attached, which Logan releases in Reviews.
name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: "The version to propose (N.N.N)"
        required: true
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    container: swift:6.4.2-noble@sha256:23d9b28ad97fb1cf1999edc3a0cb265ee915ed42299a9344e7173d5a6d2b05f4
    steps:
      - uses: actions/checkout@v5
      - run: swift build --build-tests
      - shell: bash
        run: set -o pipefail; swift test --skip-build 2>&1 | tee linux.log
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: linux-log, path: linux.log, retention-days: 1 }
  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - run: swift build --build-tests
      - shell: bash
        run: set -o pipefail; swift test --skip-build 2>&1 | tee macos.log
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: macos-log, path: macos.log, retention-days: 1 }
  proof:
    needs: [linux, macos]
    runs-on: ubuntu-24.04
    container: swift:6.4.2-noble@sha256:23d9b28ad97fb1cf1999edc3a0cb265ee915ed42299a9344e7173d5a6d2b05f4
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with: { pattern: "*-log", path: logs, merge-multiple: true }
      - run: swift build -c release --product tests-proof && swift build -c release --product proof-diff
      - shell: bash
        run: |
          bin="$(swift build -c release --show-bin-path)"
          "$bin/tests-proof" --out proof --zip proof.zip --app build_tools --version "$VERSION" \
            "linux=Linux (Swift 6.4.2)=logs/linux.log" "macos=macOS 26=logs/macos.log"
          "$bin/proof-diff" make proof.zip --out proof-diff.json
      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          retention-days: 1
          path: |
            proof.zip
            proof-diff.json
  propose:
    needs: proof
    # A release is only ever of main (Reviews releases no other draft): from any other branch, no draft at all (NCH).
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with: { name: release-files }
      - shell: bash
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::the version is N.N.N"; exit 1; }
          ! gh release view "v$VERSION" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1 || { echo "::error::v$VERSION exists"; exit 1; }
          gh release create "v$VERSION" -R "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" --title "build_tools $VERSION" \
            --notes "Proposed from $GITHUB_SHA by run $GITHUB_RUN_ID. Its proof (proof.zip) is its tests' results on Linux and macOS, compared with the release before's (proof-diff.json)." \
            proof.zip proof-diff.json
